<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>njoffcampus — Coming Soon</title>
  <meta name="description" content="Off-campus housing near TCNJ &amp; Rider in Ewing and Lawrenceville. Coming soon." />
  <link rel="icon" href="logo.png" type="image/png" />
  <style>
    :root {
      --navy: #1B3A5F;
      --navy-deep: #12263f;
      --orange: #F18A2E;
      --orange-soft: #ffb066;
      --cream: #FBF7F0;
      --cream-2: #F3EDE3;
      --ink: #1B3A5F;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(1200px 600px at 50% -10%, #fff 0%, var(--cream) 45%, var(--cream-2) 100%);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 2.5rem;
      gap: 1.25rem;
      overflow-x: hidden;
    }
    .logo {
      width: min(280px, 70vw);
      height: auto;
      animation: logoIn 900ms ease-out both;
    }
    .stage {
      width: min(720px, 94vw);
      aspect-ratio: 16 / 10;
      position: relative;
      border-radius: 24px;
      background: linear-gradient(180deg, #fffdf9 0%, #f6f0e6 100%);
      box-shadow:
        0 1px 0 rgba(27,58,95,0.06),
        0 24px 60px rgba(27,58,95,0.10);
      overflow: hidden;
      border: 1px solid rgba(27,58,95,0.08);
      animation: stageIn 1s ease-out 0.15s both;
    }
    .stage svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .copy {
      text-align: center;
      max-width: 34rem;
      animation: fadeUp 900ms ease-out 0.35s both;
    }
    h1 {
      margin: 0.2rem 0 0.55rem;
      font-size: clamp(1.75rem, 4.5vw, 2.4rem);
      font-weight: 750;
      letter-spacing: -0.02em;
      color: var(--navy);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      background: rgba(241,138,46,0.12);
      color: var(--orange);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge .dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: var(--orange);
      animation: pulse 2s ease-out infinite;
    }
    p.lead {
      margin: 0.85rem 0 0;
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      line-height: 1.45;
      color: rgba(27,58,95,0.78);
    }
    footer {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: rgba(27,58,95,0.55);
      text-align: center;
      animation: fadeUp 900ms ease-out 0.5s both;
    }
    footer a {
      color: var(--navy);
      text-decoration: none;
      font-weight: 600;
    }
    footer a:hover { color: var(--orange); }

    /* scene animations — one shared 6s "beat" so everything breathes together */
    :root { --beat: 3.5s; --ease: cubic-bezier(.45,.05,.25,1); --pop: cubic-bezier(.34,1.56,.64,1); }
    .stage svg g, .stage svg circle, .stage svg rect { transform-box: fill-box; }
    .cloud { animation: drift 12s var(--ease) infinite alternate; }
    .cloud.slow { animation-duration: 18s; animation-delay: -6s; }
    /* entrance: scene pieces pop in, staggered */
    .enter { opacity: 0; animation: popIn 700ms var(--pop) forwards; }
    .house  { transform-origin: 50% 100%; animation-delay: .35s; }
    .hat-in { animation-delay: 1.0s; }
    .cones-in { animation-delay: .75s; }
    .bags-in { animation-delay: .9s; }
    /* focal loop: hat settles, hammer taps in rhythm, window light warms, door glows */
    .hat { transform-origin: 50% 100%; animation: bob var(--beat) var(--ease) infinite; }
    .hammer { transform-origin: 30% 10%; animation: tap 0.9s var(--ease) infinite; }
    .cone-l, .cone-r { transform-origin: 50% 100%; animation: tip var(--beat) var(--ease) infinite; }
    .cone-r { animation-delay: -.5s; }
    .door { animation: doorGlow var(--beat) var(--ease) infinite; }
    .window-light { animation: windowOn var(--beat) var(--ease) infinite; }
    .lantern { animation: flicker 3s ease-in-out infinite; }
    .suitcase, .backpack { transform-origin: 50% 100%; animation: hop var(--beat) var(--ease) infinite; }
    .backpack { animation-delay: .25s; }
    .path-dot { animation: dash 1.1s var(--ease) infinite; }
    .spark { transform-origin: 50% 50%; animation: sparkle 1.6s var(--ease) infinite; }
    .smoke { transform-origin: 50% 50%; animation: puff 2.4s ease-out infinite; opacity: 0; }
    .smoke.s2 { animation-delay: 1.33s; } .smoke.s3 { animation-delay: 2.66s; }

    @keyframes logoIn { from { opacity: 0; transform: translateY(-10px) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes stageIn { from { opacity: 0; transform: translateY(18px) scale(0.97); } to { opacity: 1; transform: none; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes popIn { 0% { opacity: 0; transform: translateY(14px) scale(.85); } 100% { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(241,138,46,.55); } 70% { box-shadow: 0 0 0 7px rgba(241,138,46,0); } }
    @keyframes drift { from { transform: translateX(-28px); } to { transform: translateX(36px); } }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-14px) rotate(8deg); } }
    @keyframes tap { 0%, 100% { transform: rotate(-28deg); } 35% { transform: rotate(22deg); } 45% { transform: rotate(16deg); } }
    @keyframes tip { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-14deg); } }
    @keyframes doorGlow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.25) drop-shadow(0 0 10px rgba(241,138,46,.85)); } }
    @keyframes windowOn { 0%, 25%, 100% { fill: #dfe8f2; } 40%, 75% { fill: #ffc878; } }
    @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @keyframes hop { 0%, 55%, 100% { transform: translateY(0) scale(1,1); } 62% { transform: translateY(0) scale(1.1,.88); } 74% { transform: translateY(-22px) scale(.94,1.08); } 86% { transform: translateY(0) scale(1.06,.94); } }
    @keyframes dash { 0%, 100% { opacity: .2; transform: scale(.7); } 30% { opacity: 1; transform: scale(1.35); } }
    @keyframes sparkle { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0); } 50% { opacity: 1; transform: scale(1.4) rotate(50deg); } }
    @keyframes puff { 0% { opacity: 0; transform: translate(0,0) scale(.5); } 18% { opacity: .7; } 100% { opacity: 0; transform: translate(14px,-52px) scale(1.7); } }

    @media (prefers-reduced-motion: reduce) {
      .logo, .stage, .copy, .enter, footer { animation: none !important; opacity: 1; }
      /* keep decorative loops so the coming-soon scene still reads as "alive" */
    }
  </style>
</head>
<body>
  <img class="logo" src="logo.png" alt="njoffcampus" />

  <div class="stage" aria-hidden="true">
    <svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fffdf9"/>
          <stop offset="100%" stop-color="#efe7da"/>
        </linearGradient>
        <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#274868"/>
          <stop offset="100%" stop-color="#1B3A5F"/>
        </linearGradient>
      </defs>

      <rect width="720" height="450" fill="url(#sky)"/>

      <!-- soft hills -->
      <path d="M0 360 C120 320, 220 340, 340 350 C460 360, 560 310, 720 340 L720 450 L0 450 Z" fill="#e8dfd1" opacity="0.7"/>
      <path d="M0 390 C160 360, 280 380, 420 385 C560 390, 640 360, 720 375 L720 450 L0 450 Z" fill="#ddd3c3" opacity="0.55"/>

      <!-- clouds -->
      <g class="cloud" fill="#e7e0d5" opacity="0.9">
        <ellipse cx="120" cy="70" rx="38" ry="16"/>
        <ellipse cx="150" cy="68" rx="28" ry="14"/>
        <ellipse cx="95" cy="72" rx="22" ry="12"/>
      </g>
      <g class="cloud slow" fill="#ebe4d9" opacity="0.8">
        <ellipse cx="560" cy="55" rx="42" ry="15"/>
        <ellipse cx="595" cy="52" rx="26" ry="12"/>
        <ellipse cx="530" cy="56" rx="20" ry="10"/>
      </g>

      <!-- tree -->
      <g transform="translate(575,210)">
        <rect x="-6" y="70" width="12" height="70" rx="3" fill="#1B3A5F"/>
        <ellipse cx="0" cy="55" rx="34" ry="48" fill="#1B3A5F"/>
        <ellipse cx="-18" cy="70" rx="22" ry="32" fill="#274868"/>
        <ellipse cx="18" cy="72" rx="20" ry="30" fill="#274868"/>
      </g>

      <!-- bushes -->
      <ellipse cx="250" cy="330" rx="42" ry="22" fill="#1B3A5F"/>
      <ellipse cx="285" cy="335" rx="28" ry="16" fill="#274868"/>
      <ellipse cx="455" cy="332" rx="38" ry="20" fill="#1B3A5F"/>
      <ellipse cx="485" cy="336" rx="24" ry="14" fill="#274868"/>

      <!-- house body -->
      <g class="enter house"><g transform="translate(300,165)">
        <rect x="0" y="60" width="160" height="140" rx="6" fill="#f4efe6" stroke="#1B3A5F" stroke-width="3"/>
        <!-- roof -->
        <path d="M-18 70 L80 -10 L178 70 Z" fill="url(#roof)"/>
        <rect x="58" y="-28" width="44" height="36" rx="4" fill="#1B3A5F"/>
        <rect x="66" y="-18" width="28" height="18" rx="2" fill="#FBF7F0" opacity="0.9"/>
        <!-- chimney -->
        <rect x="18" y="8" width="22" height="42" fill="#1B3A5F"/>
        <rect x="14" y="2" width="30" height="10" rx="2" fill="#274868"/>
        <!-- window -->
        <rect class="window-light" x="22" y="95" width="42" height="42" rx="8" fill="#dfe8f2" stroke="#1B3A5F" stroke-width="3"/>
        <line x1="43" y1="95" x2="43" y2="137" stroke="#1B3A5F" stroke-width="2"/>
        <line x1="22" y1="116" x2="64" y2="116" stroke="#1B3A5F" stroke-width="2"/>
        <!-- porch -->
        <path d="M88 95 L140 95 L148 118 L80 118 Z" fill="#1B3A5F"/>
        <rect x="98" y="118" width="10" height="82" fill="#1B3A5F"/>
        <rect x="128" y="118" width="10" height="82" fill="#1B3A5F"/>
        <!-- door -->
        <rect class="door" x="100" y="125" width="36" height="75" rx="4" fill="#F18A2E"/>
        <circle cx="128" cy="165" r="3" fill="#1B3A5F"/>
        <!-- lantern -->
        <rect x="145" y="132" width="10" height="14" rx="2" fill="#1B3A5F"/>
        <rect class="lantern" x="147" y="134" width="6" height="8" fill="#ffd9a8"/>
      </g></g>
      <!-- chimney smoke -->
      <g fill="#d9d0c2"><circle class="smoke" cx="329" cy="160" r="7"/><circle class="smoke s2" cx="329" cy="160" r="7"/><circle class="smoke s3" cx="329" cy="160" r="7"/></g>

      <!-- hard hat on roof -->
      <g class="enter hat-in"><g class="hat">
        <ellipse cx="360" cy="152" rx="26" ry="10" fill="#F18A2E"/>
        <path d="M340 152 Q360 128 380 152 Z" fill="#F18A2E"/>
        <rect x="348" y="140" width="24" height="6" rx="2" fill="#ffd29a"/>
        <path d="M336 152 H384" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      </g></g>

      <!-- tiny hammer floating -->
      <g class="hammer" opacity="0.9">
        <rect x="508" y="198" width="28" height="12" rx="2" fill="#1B3A5F"/>
        <rect x="518" y="208" width="8" height="36" rx="2" fill="#F18A2E"/>
      </g>

      <!-- cones -->
      <g class="enter cones-in">
      <g class="cone-l">
        <path d="M248 318 L262 250 L276 318 Z" fill="#F18A2E"/>
        <rect x="245" y="314" width="34" height="8" rx="2" fill="#1B3A5F"/>
        <rect x="252" y="270" width="20" height="8" fill="#fff" opacity="0.9"/>
        <rect x="254" y="290" width="16" height="7" fill="#fff" opacity="0.9"/>
      </g>
      <g class="cone-r">
        <path d="M292 318 L304 262 L316 318 Z" fill="#F18A2E"/>
        <rect x="289" y="314" width="30" height="7" rx="2" fill="#1B3A5F"/>
        <rect x="296" y="278" width="16" height="7" fill="#fff" opacity="0.9"/>
      </g>

      </g>
      <!-- dotted path -->
      <g fill="#F18A2E">
        <circle class="path-dot" cx="520" cy="390" r="5" style="animation-delay:0.00s"/>
        <circle class="path-dot" cx="490" cy="378" r="5" style="animation-delay:0.18s"/>
        <circle class="path-dot" cx="462" cy="368" r="5" style="animation-delay:0.36s"/>
        <circle class="path-dot" cx="436" cy="360" r="5" style="animation-delay:0.54s"/>
        <circle class="path-dot" cx="412" cy="352" r="5" style="animation-delay:0.72s"/>
        <circle class="path-dot" cx="390" cy="345" r="4.5" style="animation-delay:0.90s"/>
        <circle class="path-dot" cx="370" cy="340" r="4" style="animation-delay:1.08s"/>
      </g>

      <g class="enter bags-in">
      <!-- suitcase -->
      <g class="suitcase">
        <rect x="400" y="318" width="48" height="36" rx="6" fill="#1B3A5F"/>
        <rect x="406" y="324" width="36" height="24" rx="3" fill="#274868"/>
        <rect x="416" y="308" width="16" height="12" rx="3" fill="#F18A2E"/>
        <circle cx="412" cy="356" r="4" fill="#F18A2E"/>
        <circle cx="436" cy="356" r="4" fill="#F18A2E"/>
      </g>

      <!-- backpack -->
      <g class="backpack">
        <rect x="458" y="322" width="34" height="40" rx="8" fill="#1B3A5F"/>
        <rect x="464" y="330" width="22" height="16" rx="3" fill="#F18A2E"/>
        <path d="M466 322 Q475 308 484 322" fill="none" stroke="#F18A2E" stroke-width="4" stroke-linecap="round"/>
        <polygon points="471,348 481,348 476,356" fill="#ffd29a"/>
      </g>

      </g>
      <!-- mailbox -->
      <g transform="translate(500,300)">
        <rect x="0" y="20" width="6" height="40" fill="#1B3A5F"/>
        <rect x="-10" y="8" width="34" height="18" rx="6" fill="#1B3A5F"/>
        <circle cx="20" cy="4" r="6" fill="#F18A2E"/>
      </g>

      <!-- sparkles -->
      <g fill="#F18A2E">
        <circle class="spark" cx="210" cy="180" r="3"/>
        <circle class="spark" cx="540" cy="160" r="2.5" style="animation-delay:0.4s"/>
        <circle class="spark" cx="180" cy="260" r="2" style="animation-delay:0.8s"/>
      </g>
    </svg>
  </div>

  <div class="copy">
    <div class="badge"><span class="dot" aria-hidden="true"></span> Under construction</div>
    <h1>Coming soon</h1>
    <p class="lead">Off-campus housing near TCNJ &amp; Rider — Ewing and Lawrenceville — for students and landlords.</p>
  </div>

  <footer>
    <a href="mailto:found@njoffcampus.com">found@njoffcampus.com</a>
    · NJoffCampus, LLC
  </footer>
</body>
</html>
